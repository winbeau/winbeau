name: Metrics

on:
  schedule: [{ cron: "0 */8 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  generate_profile:
    runs-on: ubuntu-latest
    steps:
      - name: left
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 868fd87bafd05ecce9c60cf41bb8384c

          user: winbeau
          template: classic
          base: header, metadata
          config_timezone: Asia/Shanghai
          commits_authoring: winbeau, geneva4869@163.com
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          repositories_forks: yes
          config_padding: 0, 8 + 11%
          config_order: base.header, introduction, isocalendar, habits

      - name: right
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 111ec5f3bccd7bc663dd54935fb07744

          user: winbeau
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          commits_authoring: winbeau, geneva4869@163.com

          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_other: yes
          plugin_languages_ignored: >-
            scss, html, css, ruby, gnuplot, json
          plugin_languages_recent_days: 365
          plugin_repositories: yes
          plugin_repositories_featured: IF-LAB-PKU/Pyramid-Forcing, winbeau/t2v-eval, XjuSelab/xju-feiyue
          config_padding: 0, 8 + 11%
          config_order: languages, repositories
